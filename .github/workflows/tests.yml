name: Tests

on:
  push:
  pull_request:

jobs:
  install:
    name: install.sh on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # install.sh has to work with the bash 3.2 that macOS ships.
          - os: macos-latest
            bash: /bin/bash
          # On Windows the presets run in Git Bash, which the runner has.
          - os: windows-latest
            bash: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install jq when the runner has none
        run: command -v jq || choco install jq --no-progress -y
      - name: Show the tool versions
        run: bash --version | head -1 && jq --version && git --version
      - name: Run the install tests
        run: tests/run.sh
        env:
          TEST_BASH: ${{ matrix.bash }}

  schema-library:
    name: schema library with Symfony ${{ matrix.symfony }}
    strategy:
      fail-fast: false
      matrix:
        symfony: ['6.4.*', '7.*']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the test dependencies for this Symfony version
        run: |
          composer require --working-dir tests/php --no-interaction --no-update "symfony/config:${{ matrix.symfony }}" "symfony/dependency-injection:${{ matrix.symfony }}"
          composer update --working-dir tests/php --no-interaction --no-progress
      - name: Run the schema library tests
        run: php tests/php/run.php

  lint:
    name: JSON, PHP syntax and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: tests/lint.sh
