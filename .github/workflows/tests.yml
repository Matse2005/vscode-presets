name: Tests

on:
  push:
  pull_request:

jobs:
  install:
    name: install.sh on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # install.sh has to work with the bash 3.2 that macOS ships.
          - os: macos-latest
            bash: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the install tests
        run: tests/run.sh
        env:
          TEST_BASH: ${{ matrix.bash }}

  lint:
    name: JSON, PHP syntax and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: tests/lint.sh
